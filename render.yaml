services:
  - type: web
    name: claims-api
    runtime: image
    image:
      url: ghcr.io/dev-veljanovski/backend-coding-task:latest
    plan: free
    region: frankfurt
    healthCheckPath: /health/live
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__ClaimsDatabase
        sync: false
      - key: ConnectionStrings__AuditDatabase
        sync: false
