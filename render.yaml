services:
  - type: web
    name: claims-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__ClaimsDatabase
        sync: false
      - key: ConnectionStrings__AuditDatabase
        sync: false
