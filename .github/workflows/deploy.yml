name: Deploy to MonsterASP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}

    steps:
      - uses: actions/checkout@v4
        if: ${{ env.WEBSITE_NAME != '' }}

      - uses: actions/setup-dotnet@v4
        if: ${{ env.WEBSITE_NAME != '' }}
        with:
          global-json-file: global.json

      - name: Publish
        if: ${{ env.WEBSITE_NAME != '' }}
        run: dotnet publish src/Claims.Api/Claims.Api.csproj --configuration Release --runtime win-x86 --self-contained false --output ./publish

      - name: Deploy via Web Deploy
        if: ${{ env.WEBSITE_NAME != '' }}
        shell: pwsh
        env:
          DEPLOY_USER: ${{ secrets.SERVER_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $site = $env:WEBSITE_NAME.Trim()
          $endpoint = "https://$site.siteasp.net:8172/msdeploy.axd?site=$site"
          $msdeploy = @(
            "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msdeploy) { throw "msdeploy.exe was not found on the runner" }
          $source = (Resolve-Path ./publish).Path
          & $msdeploy -verb:sync `
            "-source:contentPath=$source" `
            "-dest:contentPath=$site,computerName=$endpoint,userName=$($env:DEPLOY_USER.Trim()),password=$env:DEPLOY_PASSWORD,authType=Basic" `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule `
            -allowUntrusted
          if ($LASTEXITCODE -ne 0) { throw "Web Deploy failed with exit code $LASTEXITCODE" }
